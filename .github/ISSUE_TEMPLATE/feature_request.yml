name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: checkboxes
    id: invariants
    attributes:
      label: Architecture invariants
      description: >
        See CONTRIBUTING.md. These are the rules the project is built on.
      options:
        - label: This keeps the semantic model as the source of truth, not the diagram
        - label: This keeps layout on views rather than on elements
        - label: This keeps REST and MCP on the same domain layer

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

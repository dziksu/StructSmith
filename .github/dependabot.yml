version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Preset 10+ requires writer 9+. Upgrade the semantic-release tooling together.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      i18n:
        patterns: ["i18next", "react-i18next", "i18next-browser-languagedetector"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      express:
        patterns: ["express", "@types/express"]
      radix:
        patterns: ["@radix-ui/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build the web app
        run: bun run build

      - name: Build the marketing site
        run: bun run build:site

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Build only — publication is gated by both verification jobs below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: structsmith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name structsmith-ci -p 8080:8080 structsmith:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "health ok"; break
            fi
            if [ "$i" = "30" ]; then
              echo "server did not become healthy"; docker logs structsmith-ci; exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/workspaces > /dev/null
          docker rm -f structsmith-ci

  release:
    name: Semantic release
    needs: [verify, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'dziksu/StructSmith'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Create version tag and GitHub release
        id: release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release owns the version. Keep the release commit immutable,
      # then sync its changelog and package metadata through one reviewable PR.
      - name: Stamp source package version
        if: steps.release.outputs.version != ''
        run: bun scripts/set-build-version.ts "${{ steps.release.outputs.version }}"

      - name: Create release metadata pull request
        id: changelog-pr
        if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          base: main
          branch: automation/changelog-v${{ steps.release.outputs.version }}
          delete-branch: true
          add-paths: |
            CHANGELOG.md
            package.json
          commit-message: "docs(changelog): update for v${{ steps.release.outputs.version }}"
          title: "docs(changelog): update for v${{ steps.release.outputs.version }}"
          body: |
            Automated release metadata update generated by semantic-release.

            Release: v${{ steps.release.outputs.version }}
            Updates: CHANGELOG.md and the application version in package.json

      - name: Merge release metadata pull request
        if: steps.changelog-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.changelog-pr.outputs.pull-request-number }}
        run: |
          merge_state="$(gh pr view "$RELEASE_PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')"
          if [ "$merge_state" = "CLEAN" ]; then
            gh pr merge --squash "$RELEASE_PR_NUMBER"
          elif ! gh pr merge --squash --auto "$RELEASE_PR_NUMBER"; then
            # The PR can become immediately mergeable between the status read
            # and the auto-merge request. GitHub rejects auto-merge in that state.
            merge_state="$(gh pr view "$RELEASE_PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')"
            if [ "$merge_state" = "CLEAN" ]; then
              gh pr merge --squash "$RELEASE_PR_NUMBER"
            else
              echo "Could not merge release metadata PR; merge state is $merge_state"
              exit 1
            fi
          fi

  publish:
    name: Publish release image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ github.sha }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build the web app
        run: bun run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in the container workflow on main and tags.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: structsmith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name structsmith-ci -p 8080:8080 structsmith:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "health ok"; break
            fi
            if [ "$i" = "30" ]; then
              echo "server did not become healthy"; docker logs structsmith-ci; exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/workspaces > /dev/null
          docker rm -f structsmith-ci
